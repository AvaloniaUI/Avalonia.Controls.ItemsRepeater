name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest 
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Execute unit tests
      run: dotnet test

    - name: Execute dotnet pack
      run: dotnet pack src/**/*.csproj -o artifacts/nuget

    # Generates a per-package CycloneDX SBOM (EU Cyber Resilience Act evidence) and embeds it
    # into each .nupkg, so it must run after packing and before the packages are uploaded.
    - name: Generate SBOMs
      run: dotnet run --project build/_build.csproj

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Packages
        path: artifacts/nuget

    - name: Upload SBOMs
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: artifacts/sbom/*.cdx.json
